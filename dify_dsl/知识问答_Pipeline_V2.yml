          ,\n\n        \"NO_CONTEXT_FOLLOWUP\":\n            \"抱歉让您久等了～由于对话上下文已刷新，智牧暂时无法回溯您之前的问题。能否请您重新描述一下想咨询的内容？我会尽快为您解答。\"\
