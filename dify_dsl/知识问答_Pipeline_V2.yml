    - data:
        code: "import json\n\n\ndef main(evidence_items: list, evidence_map: list):\n\
          \    if not isinstance(evidence_items, list):\n        evidence_items =\
          \ []\n\n    if not isinstance(evidence_map, list):\n        evidence_map\
          \ = []\n\n    # 1. 建立 segment_id -> 原始 Evidence 映射\n    segment_map = {}\n\
          \n    for item in evidence_map:\n        if not isinstance(item, dict):\n\
          \            continue\n\n        segment_id = str(item.get(\"segment_id\"\
          , \"\")).strip()\n\n        if not segment_id:\n            continue\n\n\
          \        segment_map[segment_id] = item\n\n    # 2. 只处理 source=KB，按 segment_id\
          \ 找原始文档信息\n    valid_references = []\n    seen_references = set()\n\n  \
          \  for item in evidence_items:\n        if not isinstance(item, dict):\n\
          \            continue\n\n        source = str(item.get(\"source\", \"\"\
          )).strip().upper()\n\n        if source != \"KB\":\n            continue\n\
          \n        segment_id = str(item.get(\"segment_id\", \"\")).strip()\n   \
          \     evidence_text = str(item.get(\"evidence\", \"\")).strip()\n\n    \
          \    if not segment_id or not evidence_text:\n            continue\n\n \
          \       # 只要求 segment_id 真实存在\n        original = segment_map.get(segment_id)\n\
          \n        if not original:\n            continue\n\n        # 同一 segment\
          \ + evidence 去重\n        unique_key = (segment_id, evidence_text)\n\n  \
          \      if unique_key in seen_references:\n            continue\n\n     \
          \   seen_references.add(unique_key)\n\n        valid_references.append({\n\
          \            \"segment_id\": segment_id,\n            \"evidence\": evidence_text,\n\
          \            \"original\": original\n        })\n\n    # 3. 按文档聚合\n    doc_groups\
          \ = {}\n\n    for item in valid_references:\n        evidence_text = item[\"\
          evidence\"]\n        original = item[\"original\"]\n\n        document_id\
          \ = str(\n            original.get(\"document_id\", \"\")\n        ).strip()\n\
          \n        doc_id = str(\n            original.get(\"doc_id\", \"\")\n  \
          \      ).strip()\n\n        group_key = document_id or doc_id\n\n      \
          \  if not group_key:\n            continue\n\n        if group_key not in\
          \ doc_groups:\n            doc_groups[group_key] = {\n                \"\
          fileName\": original.get(\"title\", \"\"),\n                \"objectStorageKey\"\
          : original.get(\n                    \"object_storage_key\",\n         \
          \           \"\"\n                ),\n                \"objectStorageBucket\"\
          : original.get(\n                    \"object_storage_bucket\",\n      \
          \              \"\"\n                ),\n                \"content\": []\n\
          \            }\n\n        if evidence_text not in doc_groups[group_key][\"\
          content\"]:\n            doc_groups[group_key][\"content\"].append(\n  \
          \              evidence_text\n            )\n\n    references_docs = list(doc_groups.values())\n\
          \n    return {\n        \"references_docs_str\": json.dumps(\n         \
          \   references_docs,\n            ensure_ascii=False\n        ),\n     \
          \   \"has_references\": len(references_docs) > 0\n    }"
