    - data:
        code: "import json\n\n\ndef main(body: str):\n    \"\"\"\n    解析员工假期信息\n \
          \   \"\"\"\n\n    if not body:\n        return {\n            \"employee_vacation_info\"\
          : \"未获取到员工假期信息\"\n        }\n\n    try:\n        response = json.loads(body)\n\
          \    except Exception:\n        return {\n            \"employee_vacation_info\"\
          : \"员工假期信息解析失败\"\n        }\n\n    # 接口失败\n    if (\n        response.get(\"\
          success\") is not True\n        or response.get(\"code\") != 0\n    ):\n\
          \        return {\n            \"employee_vacation_info\": \"未获取到员工假期信息\"\
          \n        }\n\n    data = response.get(\"data\", {})\n    records = data.get(\"\
          records\", [])\n\n    if not records:\n        return {\n            \"\
          employee_vacation_info\": \"当前没有假期信息\"\n        }\n\n\n    result = []\n\
          \n    for item in records:\n        vacation_name = item.get(\"vacationTypeName\"\
          , \"\")\n\n        rest = item.get(\"rest\", \"0\")\n        used = item.get(\"\
          usedQuota\", \"0\")\n        quota = item.get(\"quota\", \"0\")\n\n    \
          \    start = item.get(\"deductStartDate\", \"\")\n        end = item.get(\"\
          deductEndDate\", \"\")\n\n        text = (\n            f\"{vacation_name}：\"\
          \n            f\"总额度{quota}天，\"\n            f\"已申请{used}天，\"\n        \
          \    f\"剩余{rest}天，\"\n            f\"有效期{start}至{end}\"\n        )\n\n \
          \       result.append(text)\n\n\n    return {\n        \"employee_vacation_info\"\
          : \"\\n\".join(result)\n    }"
        code_language: python3
        outputs:
          employee_vacation_info:
            children: null
            type: string
