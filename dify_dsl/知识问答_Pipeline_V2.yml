    - data:
        code: "import json\n\ndef main(notAuthMenu: str, kb_info_set: list, rtnBody:\
          \ str) -> dict:\n    \"\"\"\n    链接权限过滤节点\n    - 输入：无权限菜单URL字符串、知识库检索结果列表、HTTP接口返回体\n\
          \    - 输出：过滤后的知识库结果列表\n    \"\"\"\n    # 1. 获取无权限 URL 列表\n    no_permission_urls\
          \ = []\n    \n    # 1.1 优先使用 notAuthMenu（用户输入）\n    if notAuthMenu and isinstance(notAuthMenu,\
          \ str) and notAuthMenu.strip():\n        # 按逗号分割，清洗后转为列表\n        no_permission_urls\
          \ = [u.strip() for u in notAuthMenu.split(\",\") if u.strip()]\n    else:\n\
          \        # 1.2 从 rtnBody 解析\n        if rtnBody and isinstance(rtnBody,\
          \ str) and rtnBody.strip():\n            try:\n                data = json.loads(rtnBody)\n\
          \                if data.get(\"state\") == True:\n                    value\
          \ = data.get(\"value\", \"\")\n                    if value and isinstance(value,\
          \ str):\n                        no_permission_urls = [u.strip() for u in\
          \ value.split(\",\") if u.strip()]\n            except json.JSONDecodeError:\n\
          \                pass\n    \n    # 2. 如果没有无权限 URL，直接返回原始结果\n    if not no_permission_urls:\n\
          \        return {\"kb_info_set_filtered\": kb_info_set}\n    \n    # 3.\
          \ 过滤知识库结果\n    if not kb_info_set or not isinstance(kb_info_set, list):\n\
          \        return {\"kb_info_set_filtered\": []}\n    \n    filtered_result\
          \ = []\n    for item in kb_info_set:\n        if not isinstance(item, dict):\n\
          \            continue\n        \n        # 检查 content 字段\n        content\
          \ = item.get(\"content\", \"\")\n        if not content or not isinstance(content,\
          \ str):\n            # 没有内容的条目保留（可能是元数据）\n            filtered_result.append(item)\n\
          \            continue\n        \n        # 检查是否包含任何无权限 URL\n        should_keep\
          \ = True\n        for url in no_permission_urls:\n            if url and\
          \ url in content:\n                should_keep = False\n               \
          \ break\n        \n        if should_keep:\n            filtered_result.append(item)\n\
          \    \n    # 4. 返回过滤后的结果\n    return {\"kb_info_set_filtered\": filtered_result}"
        code_language: python3
        outputs:
          kb_info_set_filtered:
