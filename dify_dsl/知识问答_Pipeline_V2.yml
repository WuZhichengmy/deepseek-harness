          ,\n\n        \"OUT_OF_SCOPE_TECH\":\n            \"这是一个偏专业技术/科学领域的问题，超出了智牧的知识范围。智牧专注于九牧公司的制度、流程和工作指引。建议您通过专业技术论坛或咨询相关技术同事获取帮助～如果有九牧工作相关的问题，随时找我哦～\"\
          ,\n\n        \"OUT_OF_SCOPE_COMPETITOR\":\n            \"智牧目前主要收录了九牧内部的制度与知识，暂不涵盖外部竞品信息。如果您需要竞品分析，建议咨询市场研究部门。关于九牧自身的产品、制度或流程，智牧很乐意为您解答～\"\
          ,\n\n        \"GREETING\":\n            \"您好～我是智牧，九牧企业知识助手。有什么可以帮您解答的吗？您可以问我关于公司制度、流程、SOP等方面的问题哦～\"\
