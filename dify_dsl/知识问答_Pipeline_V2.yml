    - data:
        code: "import json\nfrom typing import Any\n\n\ndef main(http_res: Any) ->\
          \ dict:\n    if isinstance(http_res, str):\n        http_res = http_res.strip()\n\
          \n        if not http_res:\n            return {\n                \"user_info\"\
          : \"未找到用户信息\"\n            }\n\n        try:\n            response = json.loads(http_res)\n\
          \        except json.JSONDecodeError as exc:\n            return {\n   \
          \             \"user_info\": \"未找到用户信息\"\n            }\n\n    elif isinstance(http_res,\
          \ dict):\n        response = http_res\n\n    else:\n        return {\n \
          \           \"user_info\": \"未找到用户信息\"\n        }\n\n    if not isinstance(response,\
          \ dict):\n        return {\n            \"user_info\": \"未找到用户信息\"\n   \
          \     }\n\n    success = response.get(\"success\")\n    code = response.get(\"\
          code\")\n    error_code = str(response.get(\"errorCode\", \"\"))\n\n   \
          \ if success is not True or code != 0 or error_code != \"0\":\n        return\
          \ {\n            \"user_info\": \"未找到用户信息\"\n        }\n\n    employee_data\
          \ = response.get(\"data\")\n\n    # 接口成功，但员工不存在\n    if employee_data is\
          \ None:\n        return {\n            \"user_info\": \"未找到用户信息\"\n    \
          \    }\n\n    if not isinstance(employee_data, dict):\n        return {\n\
          \            \"user_info\": \"未找到用户信息\"\n        }\n\n    # 提取需要的两个字段\n\
          \    grade_salary_scale = employee_data.get(\"gradeSalaryScale\", \"\")\n\
          \    employee_sub_group = employee_data.get(\"employeeSubGroup\", \"\")\n\
          \n    # 如果两个字段都为空，返回未找到\n    if not grade_salary_scale and not employee_sub_group:\n\
          \        return {\n            \"user_info\": \"未找到用户信息\"\n        }\n\n\
          \    # 组装成功信息\n    user_info = f\"当前用户职等: 【{grade_salary_scale}】, 属于【 {employee_sub_group}】\"\
          \n\n    return {\n        \"user_info\": user_info\n    }"
