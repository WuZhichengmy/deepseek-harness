    - data:
        code: "from datetime import datetime, timedelta\nfrom zoneinfo import ZoneInfo\n\
          import secrets\nimport string\nimport json\nimport hashlib\n\n\nCALLER_USER\
          \ = \"dify-jmaik\"\n\n\ndef generate_nonce(length: int = 16) -> str:\n \
          \   \"\"\"\n    生成8～32位字母数字随机字符串。\n    这里固定生成16位。\n    \"\"\"\n    characters\
          \ = string.ascii_letters + string.digits\n    return \"\".join(secrets.choice(characters)\
          \ for _ in range(length))\n\n\ndef generate_sign(\n    user: str,\n    nonce:\
          \ str,\n    device_token: str,\n    begin_time: str,\n    end_time: str,\n\
          \    timestamp: str,\n) -> str:\n    \"\"\"\n    MD5(\n        user\n  \
          \      + nonce\n        + deviceToken\n        + beginTime\n        + endTime\n\
          \        + timestamp\n    )\n    \"\"\"\n    original = (\n        user\n\
          \        + nonce\n        + device_token\n        + begin_time\n       \
          \ + end_time\n        + timestamp\n    )\n\n    return hashlib.md5(original.encode(\"\
          utf-8\")).hexdigest()\n\n\ndef main(nisbos_auth_token: str, device_token:\
          \ str) -> dict:\n    nisbos_auth_token = (nisbos_auth_token or \"\").strip()\n\
          \    device_token = (device_token or \"\").strip()\n\n    if not nisbos_auth_token:\n\
          \        raise ValueError(\"nisbos_auth_token不能为空\")\n\n    if not device_token:\n\
          \        raise ValueError(\"device_token不能为空\")\n\n    tz = ZoneInfo(\"\
          Asia/Shanghai\")\n    now = datetime.now(tz).replace(microsecond=0)\n\n\
          \    # 查询过去一分钟，并预留5秒时钟偏差\n    end_dt = now - timedelta(seconds=60)\n   \
          \ begin_dt = end_dt - timedelta(minutes=1)\n\n    begin_time = begin_dt.strftime(\"\
          %Y-%m-%d %H:%M:%S\")\n    end_time = end_dt.strftime(\"%Y-%m-%d %H:%M:%S\"\
          )\n\n    timestamp = str(int(now.timestamp()))\n    nonce = generate_nonce(16)\n\
          \n    sign = generate_sign(\n        user=CALLER_USER,\n        nonce=nonce,\n\
          \        device_token=device_token,\n        begin_time=begin_time,\n  \
          \      end_time=end_time,\n        timestamp=timestamp,\n    )\n\n    payload\
          \ = {\n        \"nisbosAuthToken\": nisbos_auth_token,\n        \"user\"\
          : CALLER_USER,\n        \"beginTime\": begin_time,\n        \"endTime\"\
          : end_time,\n        \"timestamp\": timestamp,\n        \"nonce\": nonce,\n\
          \        \"sign\": sign,\n    }\n\n    return {\n        \"request_body\"\
          : json.dumps(\n            payload,\n            ensure_ascii=False,\n \
          \           separators=(\",\", \":\"),\n        )\n    }"
        code_language: python3
