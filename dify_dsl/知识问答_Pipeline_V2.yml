    - data:
        code: "def main(docs: list):\n    \"\"\"\n    将文档列表转换为包含总数和详情的结构化字符串\n   \
          \ 输入: docs - 文档对象列表，每项结构为 {doc_name, doc_type, first_category, second_category}\n\
          \    输出: doc_summary - 格式化的字符串\n    \"\"\"\n    # 1. 计算文档总数\n    total =\
          \ len(docs) if docs and isinstance(docs, list) else 0\n    \n    # 2. 构建文档详情\n\
          \    if total == 0:\n        details = \"暂无文档\"\n    else:\n        lines\
          \ = []\n        for idx, doc in enumerate(docs):\n            if not isinstance(doc,\
          \ dict):\n                continue\n            \n            doc_name =\
          \ doc.get(\"doc_name\", \"未命名文档\")\n            doc_type = doc.get(\"doc_type\"\
          , \"\")\n            first_category = doc.get(\"first_category\", \"\")\n\
          \            second_category = doc.get(\"second_category\", \"\")\n    \
          \        \n            # 拼装分类标签（仅保留非空字段）\n            tags = []\n      \
          \      if doc_type:\n                tags.append(f\"类型：{doc_type}\")\n \
          \           if first_category:\n                tags.append(f\"一级分类：{first_category}\"\
          )\n            if second_category:\n                tags.append(f\"二级分类：{second_category}\"\
          )\n            tag_str = f\"（{' | '.join(tags)}）\" if tags else \"\"\n \
          \           \n            lines.append(f\"{idx + 1}. {doc_name}{tag_str}\"\
          )\n        \n        details = \"\\n\".join(lines)\n    \n    # 3. 组装最终字符串\n\
          \    doc_summary = f\"文档总数：{total}\\n\\n文档详情：\\n{details}\"\n    \n    return\
          \ {\n        \"doc_summary\": doc_summary\n    }"
        code_language: python3
        outputs:
          doc_summary:
            children: null
            type: string
        selected: false
