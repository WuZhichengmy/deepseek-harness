    - data:
        code: "import re\n\ndef main(query: str, city_info_list: list, chat_city_info:\
          \ list):\n    # 防御性初始化\n    if not isinstance(chat_city_info, list):\n \
          \       chat_city_info = []\n    chat_city_info = [item for item in chat_city_info\
          \ if isinstance(item, dict)]\n    \n    # 1. 从 city_info_list 提取城市名称 ->\
          \ 完整信息字符串\n    city_name_to_info = {}\n    for info in city_info_list:\n\
          \        if not isinstance(info, str):\n            continue\n        #\
          \ 兼容多种格式：城市名称: XXX 或 \"城市名称\":\"XXX\"\n        match = re.search(r'城市名称[\"\
          \\']?\\s*[:：]\\s*[\"\\']?([^\"\\';,\\n]+)', info)\n        if match:\n \
          \           city_name = match.group(1).strip()\n            if city_name:\n\
          \                city_name_to_info[city_name] = info\n    \n    if not city_name_to_info:\n\
          \        city_info_str = _build_markdown(chat_city_info)\n        return\
          \ {\"chat_city_info_new\": chat_city_info, \"city_info_str\": city_info_str}\n\
          \    \n    # 2. 匹配 query 中的城市名称（按长度降序）\n    sorted_city_names = sorted(city_name_to_info.keys(),\
          \ key=len, reverse=True)\n    matched_set = set()\n    for city_name in\
          \ sorted_city_names:\n        if city_name in query:\n            matched_set.add(city_name)\n\
          \    \n    # 3. 提取本次匹配到的完整信息\n    new_matched_infos = []\n    if matched_set:\n\
          \        for info in city_info_list:\n            match = re.search(r'城市名称[\"\
          \\']?\\s*[:：]\\s*[\"\\']?([^\"\\';,\\n]+)', info)\n            if match:\n\
          \                city_name = match.group(1).strip()\n                if\
          \ city_name in matched_set:\n                    new_matched_infos.append((city_name,\
          \ info))\n    \n    # 4. 构建现有历史中的城市名称集合\n    existing_city_names = set()\n\
          \    for item in chat_city_info:\n        if isinstance(item, dict):\n \
          \           for city_name in item.keys():\n                if city_name:\n\
          \                    existing_city_names.add(city_name)\n    \n    # 5.\
          \ 追加新城市到历史（去重）\n    for city_name, info in new_matched_infos:\n        if\
          \ city_name not in existing_city_names:\n            chat_city_info.append({city_name:\
          \ info})\n            existing_city_names.add(city_name)\n    \n    # 6.\
          \ 生成 Markdown 字符串\n    city_info_str = _build_markdown(chat_city_info)\n\
          \    \n    return {\n        \"chat_city_info_new\": chat_city_info,\n \
          \       \"city_info_str\": city_info_str\n    }\n\ndef _build_markdown(city_info_list:\
          \ list) -> str:\n    if not city_info_list:\n        return \"\"\n    \n\
          \    lines = [\"# 九牧城市配置信息\"]\n    for item in city_info_list:\n       \
          \ if not isinstance(item, dict):\n            continue\n        for city_name,\
          \ info in item.items():\n            if not city_name or not info:\n   \
          \             continue\n            # 将分号或换行统一转换为逗号分隔，使内容更紧凑\n         \
          \   content = info.replace('\\n', ', ').replace(';', ', ')\n           \
          \ # 去除多余引号\n            content = content.replace('\"', '')\n          \
          \  lines.append(f\"## {city_name}\")\n            lines.append(content)\n\
          \            lines.append(\"\")\n    \n    return \"\\n\".join(lines).strip()"
