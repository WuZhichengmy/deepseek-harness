    - data:
        code: "def _safe_cdata(text: str) -> str:\n    \"\"\"\n    避免内容中出现 ]]> 导致\
          \ CDATA 被提前关闭。\n    \"\"\"\n    return str(text).replace(\"]]>\", \"]]]]><![CDATA[>\"\
          )\n\n\ndef main(kb_info_set_merged: list):\n    if not isinstance(kb_info_set_merged,\
          \ list):\n        kb_info_set_merged = []\n\n    # 先整理有效文档和有效 segment\n\
          \    valid_docs = []\n\n    for doc in kb_info_set_merged:\n        if not\
          \ isinstance(doc, dict):\n            continue\n\n        content_list =\
          \ doc.get(\"content_list\", [])\n        if not isinstance(content_list,\
          \ list):\n            content_list = []\n\n        # segment 去空、去重，同时保持原顺序\n\
          \        seen = set()\n        valid_contents = []\n\n        for content\
          \ in content_list:\n            if not isinstance(content, str):\n     \
          \           continue\n\n            content = content.strip()\n        \
          \    if not content:\n                continue\n\n            if content\
          \ in seen:\n                continue\n\n            seen.add(content)\n\
          \            valid_contents.append(content)\n\n        # 没有有效正文的文档不进入 Evidence\n\
          \        if not valid_contents:\n            continue\n\n        valid_docs.append({\n\
          \            \"document_id\": doc.get(\"document_id\", \"\"),\n        \
          \    \"title\": doc.get(\"title\", \"未命名文档\"),\n            \"object_storage_key\"\
          : doc.get(\"object_storage_key\", \"\"),\n            \"object_storage_bucket\"\
          : doc.get(\"object_storage_bucket\", \"\"),\n            \"contents\": valid_contents\n\
          \        })\n\n    md_parts = [\"# Knowledge Evidence\"]\n    xml_parts\
          \ = [\"<knowledge_base>\"]\n    evidence_map = []\n\n    for doc_index,\
          \ doc in enumerate(valid_docs, start=1):\n        doc_id = f\"D{doc_index}\"\
          \n        title = doc[\"title\"]\n        document_id = doc[\"document_id\"\
          ]\n\n        # =========================\n        # 1. Markdown：给 Responder\n\
          \        # =========================\n        md_parts.append(f\"## Document\
          \ [{doc_id}] {title}\")\n\n        # =========================\n       \
          \ # 2. XML：给 Reference Selection\n        # =========================\n\
          \        xml_parts.append(f'  <doc id=\"{doc_id}\">')\n        xml_parts.append(\n\
          \            f'    <title><![CDATA[{_safe_cdata(title)}]]></title>'\n  \
          \      )\n\n        if document_id:\n            xml_parts.append(\n   \
          \             f'    <document_id>{document_id}</document_id>'\n        \
          \    )\n\n        for seg_index, content in enumerate(doc[\"contents\"],\
          \ start=1):\n            segment_id = f\"{doc_id}-S{seg_index}\"\n\n   \
          \         # ---------- Markdown ----------\n            md_parts.append(f\"\
          ### Segment [{segment_id}]\")\n            md_parts.append(content)\n\n\
          \            # ---------- XML ----------\n            xml_parts.append(\n\
          \                f'    <segment id=\"{segment_id}\"><![CDATA['\n       \
          \         f'{_safe_cdata(content)}'\n                f']]></segment>'\n\
          \            )\n\n            # ---------- Canonical Mapping ----------\n\
          \            evidence_map.append({\n                \"segment_id\": segment_id,\n\
          \                \"doc_id\": doc_id,\n                \"doc_index\": doc_index,\n\
          \                \"document_id\": document_id,\n                \"title\"\
          : title,\n                \"object_storage_key\": doc[\"object_storage_key\"\
          ],\n                \"object_storage_bucket\": doc[\"object_storage_bucket\"\
          ],\n                \"content\": content\n            })\n\n        md_parts.append(\"\
          \")\n        xml_parts.append(\"  </doc>\")\n\n    xml_parts.append(\"</knowledge_base>\"\
          )\n\n    return {\n        \"knowledge_md\": \"\\n\".join(md_parts).strip(),\n\
          \        \"knowledge_xml\": \"\\n\".join(xml_parts).strip(),\n        \"\
          evidence_map\": evidence_map\n    }"
        code_language: python3
        outputs:
          evidence_map:
            children: null
            type: array[object]
          knowledge_md:
            children: null
            type: string
          knowledge_xml:
            children: null
            type: string
