          ,\n\n        \"EMOTIONAL_COMPLAINT\":\n            \"感谢您的分享，智牧理解您的感受。智牧目前主要提供公司制度与知识查询服务，如果您在工作中遇到具体的制度或流程问题，欢迎随时向我提问，我会尽力帮到您～\"\
          ,\n\n        \"DOC_GENERATE_EDIT\":\n            \"智牧目前还不具备文档编写和格式编辑的能力呢～建议您参考OA文档中心已有模板，或联系相关归口部门协助。如果您需要查询已有的制度或模板，智牧可以帮您定位哦～\"\
